# nginx del contenedor "web": SPA en / y proxy HTTP hacia el backend Laravel
# (contenedor con su propio nginx, puerto 80) para /api/* y /up.
# Detras de Traefik (Dokploy), que termina TLS y manda X-Forwarded-Proto.
# BACKEND_HOST = nombre del servicio/app del backend en la red de Dokploy.

upstream backend {
    server glucyai-backend-xr67ba:80;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Health del propio nginx (lo usa el HEALTHCHECK de la imagen).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API Laravel y health de Laravel: proxy al backend.
    location ^~ /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location = /up {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Assets con hash de Vite: cache larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta del panel cae en index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
