# nginx del contenedor "web": SPA en / y FastCGI hacia php-fpm (servicio
# "app") para /api/* y /up. Detras de Caddy, que termina TLS y manda
# X-Forwarded-Proto; Laravel confia en el proxy (bootstrap/app.php).

upstream php_fpm {
    server app:9000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Health del propio nginx (lo usa el HEALTHCHECK de la imagen).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API Laravel y health de Laravel: siempre a index.php.
    location ^~ /api/ {
        rewrite ^ /index.php last;
    }

    location = /up {
        rewrite ^ /index.php last;
    }

    location = /index.php {
        internal;
        # Ruta DENTRO del contenedor php-fpm; nginx no necesita tener el codigo.
        root /var/www/html/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_fpm;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Assets con hash de Vite: cache larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta del panel cae en index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
